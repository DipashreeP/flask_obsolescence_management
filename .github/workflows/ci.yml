name: Flask Obsolescence CI

on: [push, pull_request]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pip-audit safety black ruff bandit pytest

      - name: Run Audits
        run: python audits/audit_runner.py

      - name: Lint + Test
        run: |
          black app/
          ruff app/
          pytest
